<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>MLBB Coach — Start</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card"><div class="eyebrow">MOBILE LEGENDS • ITEM COACH</div><h1>Your live build companion</h1><p>Create a token, send it to your MLBB Coach Skill, and keep your next-item advice on your screen.</p><button id="start">Start a game</button><section id="result" hidden><div class="muted">Your game token</div><div class="token" id="token"></div><p id="message"></p><button id="copy" class="secondary">Copy message</button><a id="open" class="link">Open live display →</a></section><p class="foot">MCP endpoint: <code>/mcp</code> · Live display polls SQLite every 2 seconds.</p></main><script>
let message='';document.getElementById('start').onclick=async()=>{const btn=document.getElementById('start');btn.disabled=true;try{const r=await fetch('/api/games',{method:'POST'});const d=await r.json();if(!r.ok)throw Error(d.error);message=d.message;document.getElementById('token').textContent=d.token;document.getElementById('message').textContent=message;document.getElementById('open').href=d.url;document.getElementById('result').hidden=false;}catch(e){alert(e.message);}finally{btn.disabled=false;}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(message);document.getElementById('copy').textContent='Copied!';};</script></body></html>
